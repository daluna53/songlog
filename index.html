/* Layout: cream-yellow archive, single read-only column. */
:root{--bg:#fff9df;--line:#f0df9c;--text:#18324b;--muted:#5f7387;--accent:#ffdc55;--gold-ink:#8a6a00;--radius:16px;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(135deg,#fff9df 0%,#fff3b9 100%);background-attachment:fixed;color:var(--text);font:15px/1.55 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
button,input,select{font:inherit}a{color:var(--gold-ink)}
:focus-visible{outline:2px solid var(--gold-ink);outline-offset:2px}
.shell{max-width:900px;margin:auto;padding-block:26px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.logo{width:44px;height:44px;flex:none;border-radius:14px;background:#18324b;display:grid;place-items:center;color:#ffdc55;font-size:23px;font-weight:900}
.topbar h1{font-size:20px;margin:0;letter-spacing:.03em}
.topbar p{margin:2px 0 0;color:var(--muted);font-size:12px}
.hero,.panel,.stat{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 5px 18px rgba(171,135,25,.06)}
.hero{padding:26px 28px;margin-bottom:18px;background:linear-gradient(145deg,#fffef8,#fff9e8)}
.eyebrow{color:var(--gold-ink);font-size:12px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}
.hero h2{font-size:clamp(26px,5vw,40px);line-height:1.2;margin:10px 0 8px;text-wrap:balance}
.hero h2 span{background:linear-gradient(transparent 58%,var(--accent) 58%);padding:0 .1em}
.who{color:var(--muted);margin:0;font-size:14px}
.who b{color:var(--text);font-size:17px;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{padding:14px 18px;background:linear-gradient(145deg,#fffef8,#fff8d9)}
.stat .n{font-size:26px;font-weight:850;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .t{font-size:12px;color:var(--muted)}
.panel{padding:22px;min-width:0}
.panel h3{font-size:18px;margin:0}
.sub{color:var(--muted);font-size:12px;margin-top:4px}
.head{margin-bottom:16px}
input,select{width:100%;background:#fff;border:1px solid #cfd8e1;color:var(--text);border-radius:10px;padding:11px 12px;outline:none}
input:focus,select:focus{border-color:#d9a900;box-shadow:0 0 0 3px #ffdc5566}
.filter-row{display:flex;gap:8px;align-items:center;margin:12px 0 14px;flex-wrap:wrap}
.filter-row select{width:auto;max-width:200px;padding:8px 10px;font-size:13px}
.count{margin-left:auto}
.btn{border:1px solid #eadb9e;border-radius:11px;padding:7px 11px;font-weight:700;font-size:12px;background:#fff8d8;color:#18324b;text-decoration:none;display:inline-block;white-space:nowrap;transition:.15s}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.song-list{display:flex;flex-direction:column;gap:10px}
.song{border:1px solid var(--line);background:#fffefa;border-radius:14px;padding:14px;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center}
.trackno{width:40px;height:40px;border-radius:12px;background:#fff3bc;color:var(--gold-ink);display:grid;place-items:center;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.song-main{min-width:0}
.song-title{font-weight:750;overflow-wrap:anywhere}
.song-meta{font-size:12px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.time{font-size:12px;color:var(--gold-ink);font-variant-numeric:tabular-nums;margin-right:7px;font-weight:700}
.song-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tag-chip{border:1px solid #eadb9e;background:#fff5c8;color:#6b5400;border-radius:999px;padding:2px 8px;font-size:11px;line-height:1.6}
.song-note{margin-top:7px;font-size:13px;color:#3d556b;white-space:pre-line;overflow-wrap:anywhere;border-left:3px solid var(--line);padding-left:9px}
.empty{padding:28px 12px;text-align:center;color:var(--muted);border:1px dashed #d9c97a;border-radius:14px}
.empty strong{display:block;color:var(--text);margin-bottom:5px}
.foot{font-size:12px;color:var(--muted);margin-top:20px;text-align:center}
@media(max-width:520px){.shell{padding-top:17px}.hero{padding:20px}.panel{padding:16px}.stats{gap:8px}.stat{padding:12px}.stat .n{font-size:21px}.stat .t{font-size:11px}.song{grid-template-columns:34px minmax(0,1fr);gap:10px}.trackno{width:34px;height:34px}.song .btn{grid-column:2;justify-self:start}.filter-row select{flex:1;max-width:none}}
@media(prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}}
</style>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function timeLabel(sec){var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?(h+':'+pad(m)+':'+pad(s)):(pad(m)+':'+pad(s));}
function canonical(s){return (s||'').normalize('NFKC').toLocaleLowerCase().replace(/[\s　"'「」『』【】()[\]（）、，,。.!！?？・·~〜_-]/g,'');}
function ytLink(s){
  if(!s.videoId)return s.url||'#';
  return 'https://www.youtube.com/live/'+encodeURIComponent(s.videoId)+'?t='+Math.max(0,Math.floor(Number(s.seconds)||0));
}
function normSong(s){
  var sec=Number(s&&s.seconds),added=Number(s&&s.addedAt);
  if(!Number.isFinite(added)){var p=Date.parse(s&&s.addedAt);added=Number.isFinite(p)?p:0;}
  return {
    title:String((s&&s.title)==null?'':s.title).trim(),
    artist:String((s&&s.artist)||'').trim(),
    seconds:Number.isFinite(sec)?Math.max(0,Math.floor(sec)):0,
    stamp:String((s&&s.stamp)||''),
    videoId:String((s&&s.videoId)||''),
    url:String((s&&s.url)||''),
    streamTitle:String((s&&s.streamTitle)||''),
    date:String((s&&s.date)||''),
    addedAt:added,
    note:String((s&&s.note)||''),
    tags:Array.isArray(s&&s.tags)?s.tags.map(function(t){return String(t).trim();}).filter(Boolean):[]
  };
}
function normState(v){
  return {
    vtuber:(v&&typeof v.vtuber==='string'&&v.vtuber.trim())?v.vtuber.trim():'我的 VTuber',
    songs:(v&&Array.isArray(v.songs)?v.songs:[]).map(normSong).filter(function(s){return s.title;})
  };
}
var db={vtuber:'我的 VTuber',songs:[]};
var ui={q:'',sort:'recent',tag:''};

function renderStats(){
  $('who').textContent=db.vtuber;
  document.title='歌回索引｜'+db.vtuber;
  $('songCount').textContent=db.songs.length;
  $('uniqueCount').textContent=new Set(db.songs.map(function(s){return canonical(s.title);}).filter(Boolean)).size;
  $('totalPlays').textContent=db.songs.length;
}
function renderTags(){
  var all=Array.from(new Set(db.songs.reduce(function(a,s){return a.concat(s.tags);},[]))).sort(function(a,b){return a.localeCompare(b,'zh-Hant');});
  $('tagFilter').innerHTML='<option value="">全部標籤</option>'+all.map(function(t){return '<option value="'+esc(t)+'">'+esc(t)+'</option>';}).join('');
  $('tagFilter').value=ui.tag;
}
function renderList(){
  var q=ui.q.trim().toLocaleLowerCase();
  var counts={};db.songs.forEach(function(s){var k=canonical(s.title);if(k)counts[k]=(counts[k]||0)+1;});
  var list=db.songs.filter(function(s){
    var hay=[s.title,s.artist,s.streamTitle,s.date,s.note].concat(s.tags).join(' ').toLocaleLowerCase();
    return hay.indexOf(q)>=0&&(!ui.tag||s.tags.indexOf(ui.tag)>=0);
  });
  var c=function(s){return counts[canonical(s.title)]||0;};
  if(ui.sort==='time')list.sort(function(a,b){return a.date.localeCompare(b.date)||a.seconds-b.seconds;});
  else if(ui.sort==='timeDesc')list.sort(function(a,b){return b.date.localeCompare(a.date)||b.seconds-a.seconds;});
  else if(ui.sort==='title')list.sort(function(a,b){return a.title.localeCompare(b.title,'zh-Hant');});
  else if(ui.sort==='popular')list.sort(function(a,b){return c(b)-c(a)||b.addedAt-a.addedAt;});
  else list.sort(function(a,b){return b.addedAt-a.addedAt;});
  $('resultCount').textContent=list.length+' 筆結果';
  if(!list.length){
    $('songList').innerHTML='<div class="empty"><strong>'+(db.songs.length?'沒有符合的歌曲':'歌單還沒有內容')+'</strong>'+(db.songs.length?'試試其他關鍵字或標籤。':'稍後再來看看。')+'</div>';
    return;
  }
  $('songList').innerHTML=list.map(function(s,i){
    var tags=s.tags.length?'<div class="song-tags">'+s.tags.map(function(t){return '<span class="tag-chip">'+esc(t)+'</span>';}).join('')+'</div>':'';
    var note=s.note?'<div class="song-note">'+esc(s.note)+'</div>':'';
    return '<article class="song"><div class="trackno">'+pad(i+1)+'</div><div class="song-main"><div class="song-title">'+esc(s.title)+'</div>'
      +'<div class="song-meta">'+esc(s.artist||'原唱未填')+' · '+esc(s.date||'日期未填')+' · '+esc(s.streamTitle||'未命名直播')+'</div>'
      +'<div class="song-meta"><span class="time">'+esc(s.stamp||timeLabel(s.seconds))+'</span>同名歌曲收錄 '+c(s)+' 次</div>'+tags+note+'</div>'
      +'<a class="btn" href="'+esc(ytLink(s))+'" target="_blank" rel="noopener noreferrer" title="開啟 YouTube 時間戳">▶ 播放</a></article>';
  }).join('');
}
function renderAll(){renderStats();renderTags();renderList();}

$('searchInput').addEventListener('input',function(e){ui.q=e.target.value;renderList();});
$('sortSelect').addEventListener('change',function(e){ui.sort=e.target.value;renderList();});
$('tagFilter').addEventListener('change',function(e){ui.tag=e.target.value;renderList();});

try{db=normState(JSON.parse($('seed').textContent));}catch(e){}
renderAll();

/* If a songs.json sits next to this page, it replaces the embedded data. */
if(window.fetch&&/^https?:$/.test(location.protocol)){
  fetch('songs.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(j){
    if(j&&Array.isArray(j.songs)){db=normState(j);renderAll();}
  }).catch(function(){});
}
})();
</script>
